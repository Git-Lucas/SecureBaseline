name: traceability

# Sem filtro `paths`: um PR só de documentação também precisa destes checks
# obrigatorios, senão eles ficam pendentes para sempre e travam o merge.
on:
  pull_request:
  workflow_dispatch:

# GOV-11: nenhum workflow tem permissao de administrar o repositorio. Cada job
# declara apenas o escopo minimo de que precisa.
permissions: {}

jobs:
  # GOV-05: nenhum arquivo versionado pode referenciar um caminho ignorado
  # pelo git. O nome do job e o context do required status check.
  ignored-path-references:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for references to ignored paths
        run: |
          set -euo pipefail
          # Lista fixa (design D7): mantida em sincronia manual com .gitignore
          # sempre que este mudar (regra "documentacao acompanha a mudanca").
          # Classe [/\\] cobre referencias com separador Unix (/) e Windows (\),
          # ja que o texto versionado pode ser escrito em qualquer ambiente.
          PATTERN='docs[/\\]prd|openspec[/\\]|\.claude[/\\]|CLAUDE\.md|\.claudeignore'
          if git grep -n -I -E "$PATTERN" -- ':!.gitignore' ':!.github/workflows/traceability.yml'; then
            echo "::error::Versioned files must not reference git-ignored paths (GOV-05)." >&2
            exit 1
          fi
          echo "No references to ignored paths found."

  # GOV-13: valida docs/matriz-asvs.md contra o JSON oficial do ASVS 5.0.0.
  asvs-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate ASVS matrix
        run: dotnet run tools/asvs-matrix/ValidateAsvsMatrix.cs
