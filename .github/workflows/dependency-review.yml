name: dependency-review

on:
  pull_request:

permissions: {}

jobs:
  # SUP-05: bloqueia dependencias com vulnerabilidade conhecida de severidade
  # low ou maior. Sob Central Package Management o dependency graph do NuGet
  # e quase cego (reporta versoes como `>= 0`), entao este check cobre de
  # fato as GitHub Actions; NuGet fica coberto por NuGetAudit (SUP-11, SUP-13).
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: never
